<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보험 정보 비교</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  :root{
    --blue:#1f5fd6; --blue-d:#174bb0; --blue-l:#eaf1ff; --blue-ll:#f5f8ff;
    --green:#16a34a; --green-d:#15803d; --green-l:#e9f8ef; --amber:#b45309; --amber-l:#fff4e0;
    --ink:#111827; --sub:#374151; --mute:#6b7280; --line:#e5e7eb; --bg:#eef2f8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0}
  .screen{background:#fff;max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .icon-btn:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 18px 6px}
  .top h2{font-size:22px;font-weight:800}
  .icon-btn{background:none;border:0;font-size:24px;color:var(--ink);cursor:pointer;width:40px;height:40px}
  .scroll{flex:1;overflow-y:auto;padding:4px 16px 20px}
  .scroll::-webkit-scrollbar{width:0}


  .tabs{display:flex;gap:8px;margin:0 0 14px}
  .tab{flex:1;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16.5px;color:var(--mute);font-weight:600;cursor:pointer}
  .tab.on{border-color:var(--blue);color:var(--blue);background:var(--blue-ll);font-weight:800}

  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .cat{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 2px 10px;cursor:pointer;font:inherit;
       display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--sub);transition:.15s}
  .cat .ic{font-size:26px;line-height:1}
  .cat span{font-size:16px;font-weight:700;white-space:nowrap}
  .cat.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(31,95,214,.28)}
  .cat:focus-visible,.tab:focus-visible,.acc-h:focus-visible,.btn:focus-visible,.toggle:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}

  .cond{background:var(--blue-ll);border:1px solid #d7e3fb;border-radius:12px;padding:12px;font-size:15px;color:var(--sub);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cond b{color:var(--ink)}
  .cond a{color:var(--blue);font-weight:700;text-decoration:none;font-size:15px;white-space:nowrap}

  /* 내 품종 보험 (DB insurance 스키마) */
  .my-acc{margin-bottom:16px}
  .retry:focus-visible,.my-rest summary:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}
  .my-list{list-style:disc;padding-left:18px;display:flex;flex-direction:column;gap:4px}
  .my-rest summary{font-size:14px;font-weight:700;color:var(--blue);cursor:pointer;padding-top:4px}
  .ben p.pre{white-space:pre-line}
  [hidden]{display:none!important}
  /* 상세 섹션 버튼 → 누르면 아래에서 올라오는 상세 창 */
  .sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .sec-btn{display:flex;align-items:center;gap:8px;min-width:0;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;line-height:1.3;word-break:keep-all}
  .sec-btn .bi{flex:none;width:30px;height:30px;border-radius:8px;background:var(--green-l);display:grid;place-items:center;font-size:16px}
  .sec-btn::after{content:"›";margin-left:auto;padding-left:4px;color:var(--mute);font-size:20px;font-weight:400}
  .sec-btn:hover{border-color:#c9d8f7;background:var(--blue-ll)}
  .sec-btn:focus-visible,.sheet .icon-btn:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}
  .sheet-dim{position:absolute;inset:0;background:rgba(17,24,39,.4);z-index:8}
  /* 상세 팝업: 앱 화면 가운데에 뜨는 창, 닫기(✕)는 오른쪽 위 */
  .sheet{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);max-height:min(78%,620px);background:#fff;border-radius:18px;z-index:9;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(17,24,39,.25);animation:popIn .18s ease-out}
  @keyframes popIn{from{opacity:0;transform:translateY(-50%) scale(.96)}}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
  .sheet-h{position:relative;display:flex;align-items:center;gap:10px;padding:16px 52px 12px 16px;border-bottom:1px solid var(--line)}
  .sheet-h .bi{flex:none;width:38px;height:38px;border-radius:10px;background:var(--green-l);display:grid;place-items:center;font-size:20px}
  .sheet-h h3{flex:1;min-width:0;font-size:19px;font-weight:800;line-height:1.3}
  .sheet-h h3 small{display:block;font-size:13.5px;color:var(--mute);font-weight:500}
  .sheet-h .icon-btn{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;font-size:20px;color:var(--sub)}
  .sheet-h .icon-btn:hover{background:#f3f4f6}
  .sheet-b{overflow-y:auto;padding:14px 16px 20px}
  .sheet-b p{font-size:16px;color:var(--sub);line-height:1.7}
  .sheet-b h4{font-size:15.5px;font-weight:800;margin:14px 0 6px}
  .sheet-b h4:first-child{margin-top:0}
  .sheet-b .my-list{gap:8px;font-size:16px;color:var(--sub);line-height:1.65}
  .sm-note{font-size:14px;color:var(--mute);margin-bottom:4px}
  .my-state{border:1px dashed #c9d8f7;border-radius:16px;padding:16px 14px;margin-bottom:16px;font-size:15.5px;color:var(--sub);line-height:1.6;background:var(--blue-ll)}
  .my-state.err{border-color:#f3b4b4;background:#fffafa}
  .retry{margin-top:10px;font:inherit;font-size:15px;font-weight:700;color:var(--blue);background:#fff;border:1px solid #c9d8f7;border-radius:10px;padding:8px 14px;cursor:pointer}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .bar b{font-size:17.5px} .bar b em{font-style:normal;color:var(--blue)}
  .toggle{font:inherit;font-size:14.5px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;color:var(--sub);cursor:pointer;font-weight:600}
  .toggle.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* 드롭다운 블록 (보험·지원제도 공통) */
  .acc{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff;overflow:hidden;transition:border-color .15s}
  .acc.mine{border-color:#b9cdf5}
  .acc.open{border:2px solid var(--blue);box-shadow:0 6px 18px rgba(31,95,214,.12)}
  .acc.sup.open{border-color:var(--green);box-shadow:0 6px 18px rgba(22,163,74,.12)}
  .acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px 12px;background:none;border:0;font:inherit;text-align:left;cursor:pointer;color:inherit}
  .acc-ic{width:46px;height:46px;border-radius:13px;background:var(--blue-l);display:grid;place-items:center;font-size:24px;flex:none}
  .sup .acc-ic{background:var(--green-l)}
  .acc-t{flex:1;min-width:0}
  .acc-t b{display:block;font-size:17px;line-height:1.4}
  .acc-t small{font-size:14px;color:var(--mute)}
  .badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
  .bd{display:inline-block;font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 7px}
  .bd.mine{background:var(--blue);color:#fff}
  .bd.ok{background:var(--green-l);color:var(--green-d)}
  .bd.ex{background:#f3f4f6;color:var(--mute)}
  .bd.tbd{background:var(--amber-l);color:var(--amber)}
  .chev{width:30px;height:30px;border-radius:50%;background:#f3f4f6;display:grid;place-items:center;flex:none;transition:transform .2s}
  .chev::before{content:"";width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:translateY(-2px) rotate(45deg)}
  .acc.open .chev{transform:rotate(180deg);background:var(--blue-l)}
  .acc-b{display:none;padding:0 14px 14px}
  .acc.open .acc-b{display:block}

  .hit{display:flex;gap:8px;align-items:flex-start;background:#fff7d6;border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.5;margin-bottom:10px;color:#713f12}
  .hit b{color:#713f12}
  .hit.no{background:#f3f4f6;color:var(--sub)} .hit.no b{color:var(--ink)}
  .ben{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .ben:first-of-type{border-top:0}
  .ben .bi{width:34px;height:34px;border-radius:9px;background:var(--green-l);display:grid;place-items:center;font-size:17px;flex:none}
  .ben h5{font-size:16px;font-weight:800;margin-bottom:4px}
  .ben p{font-size:15px;color:var(--sub);line-height:1.6}
  .ben p+p{margin-top:4px}
  .ben .sm{font-size:14px;color:var(--mute)}
  .tbd{display:inline-block;font-size:12.5px;font-weight:700;background:var(--amber-l);color:var(--amber);border-radius:5px;padding:1px 6px;vertical-align:1px}
  .chips{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .chip{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:7px 10px;border-radius:10px;background:#f6f7f9;color:var(--sub)}
  .chip i{font-style:normal;font-size:13.5px;font-weight:700;padding:2px 8px;border-radius:99px}
  .chip i.base{background:var(--green-l);color:var(--green-d)}
  .chip i.opt{background:var(--blue-l);color:var(--blue)}
  .chip i.excl{background:var(--amber-l);color:var(--amber)}
  .chip i.none{background:#eceef1;color:var(--mute)}
  .chip.on{background:#fde68a;color:#713f12;font-weight:700}
  .docs{display:flex;gap:6px;margin-top:6px}
  .doc{flex:1;font-size:14px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:8px 2px;color:var(--sub)}
  .doc::before{content:"PDF ";color:#dc2626;font-weight:800;font-size:12px}
  .acc-cta{display:flex;gap:6px;margin-top:12px}
  .acc-cta a{flex:1;text-align:center;font-size:15.5px;font-weight:700;border-radius:12px;padding:13px 4px;text-decoration:none}
  .acc-cta .p{background:var(--blue);color:#fff}
  .acc-cta .s{background:#fff;color:var(--blue);border:1px solid #c9d8f7}
  .sup .acc-cta .p{background:var(--green)}
  .sup .acc-cta .s{color:var(--green-d);border-color:#bfe5cc}
  .steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .steps li{counter-increment:s;font-size:15px;color:var(--sub);line-height:1.5;display:flex;gap:8px}
  .steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:1px}

  .ex{font-size:13.5px;color:var(--mute);margin-top:8px;line-height:1.6}
  .btn{display:flex;width:100%;justify-content:center;align-items:center;gap:6px;border-radius:14px;padding:15px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;text-decoration:none;border:0}
  .btn.pri{background:var(--ink);color:#fff;margin-top:10px}
  .foot{font-size:13px;color:var(--mute);margin-top:12px;line-height:1.6}
  .empty{font-size:15px;color:var(--mute);padding:24px 0;text-align:center}

</style>
</head>
<body>


<div class="screen">
  <div class="top">
    <button class="icon-btn" aria-label="뒤로">‹</button>
    <h2>보험 정보 비교</h2>
    <span class="icon-btn" aria-hidden="true"></span>
  </div>

  <div class="sheet-dim" id="sheetDim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-h"><span class="bi" id="sheetIc" aria-hidden="true"></span><h3 id="sheetTitle"></h3><button class="icon-btn" id="sheetClose" aria-label="닫기">✕</button></div>
    <div class="sheet-b" id="sheetBody"></div>
  </div>

  <div class="scroll">
    <div class="tabs" role="tablist">
      <button class="tab on" role="tab" aria-selected="true" data-tab="ins">내 조건에 맞는 보험</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="sup">지원제도</button>
    </div>

    <div class="cats" id="cats"></div>

    <div class="cond">
      <span id="condText"></span>
      <a href="app.html#register">조건 수정</a>
    </div>

    <div id="mySummary" aria-live="polite"></div>

    <div class="bar">
      <b id="cnt"></b>
    </div>

    <div id="list"></div>

    <p class="ex" id="exNote"></p>
    <p class="foot" id="foot"></p>
  </div>

  <nav id="tabbar" data-active="insurance"></nav>
  <script src="common.js"></script>
</div>

<script>
/* 보험 정보 화면: 보여 주는 내용은 모두 백엔드(FastAPI)가 DB에서 읽어 온 값입니다.
   - insurance 스키마: /api/v1/insurance/products?species=&method= (내 조건 상품과 순서)
                       /api/v1/insurance/overview (위험별 보장 분류), /api/v1/insurance/products/{id} (상세)
   - gov24 스키마:     /api/v1/support/services?region= (지원제도)
   화면이 덧붙이는 것은 칸 이름(제목)뿐입니다. 서버에 연결되지 않으면 예시 대신 오류 안내를 보여 줍니다. */
const CATS=[
  {id:'all',ic:'📋',label:'전체'},
  {id:'hot',ic:'🌡️',label:'고수온'},
  {id:'cold',ic:'❄️',label:'저수온'},
  {id:'redtide',ic:'🦠',label:'적조'}
];
const RISK3=['hot','cold','redtide'];
const RISK_RE={hot:/고수온|이상수온/,cold:/저수온|이상수온/,redtide:/적조/}; // 백엔드 overview와 같은 기준

let tab='ins', cat='hot', openId=-1, openSup='';
const $=s=>document.querySelector(s);

const API_BASE='http://127.0.0.1:8000'; // ← 백엔드 주소 (README '백엔드 실행' 참고)
const TIMEOUT_MS=15000;
let farm=null;
try{farm=JSON.parse(sessionStorage.getItem('farm'));}catch{}
let myResult=null, myOpen=false; // myResult.state: nofarm | loading | ok | none | error (myOpen은 공유용 스냅샷이 씀)

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const speciesName=s=>String(s||'').replace(/\s*\(.*\)\s*/,'').trim(); // '조피볼락 (우럭)' → '조피볼락'
const textOf=v=>v==null?'':(typeof v==='string'?v:JSON.stringify(v));
const cut=(v,n)=>{const t=String(v??'');return t.length>n?t.slice(0,n).trimEnd()+'…':t;};
const C=id=>CATS.find(x=>x.id===id);

async function getJSON(url){
  const ctrl=new AbortController(), timer=setTimeout(()=>ctrl.abort(),TIMEOUT_MS);
  try{
    const res=await fetch(url,{signal:ctrl.signal});
    if(!res.ok)throw new Error('HTTP '+res.status);
    return await res.json();
  }finally{clearTimeout(timer);}
}

/* ===== 내 조건(품종·양식 방식)에 맞는 상품 ===== */
let myIds=null; // DB 상품 id, 백엔드가 정한 우선순위 순
async function loadMySummary(){
  if(!farm){myResult={state:'nofarm'};myIds=null;markMine();renderMy();render();return;}
  myResult={state:'loading'};renderMy();render();
  try{
    const q=new URLSearchParams({species:farm.species});
    if(farm.method==='가두리'||farm.method==='육상')q.set('method',farm.method);
    const list=await getJSON(`${API_BASE}/api/v1/insurance/products?${q}`);
    myIds=(Array.isArray(list)?list:[]).map(x=>x.product_id);
    myResult={state:myIds.length?'ok':'none'};
  }catch(e){myResult={state:'error'};myIds=null;}
  markMine();renderMy();render();
}
function renderMy(){
  const box=$('#mySummary');
  box.hidden=tab!=='ins';
  const st=myResult?.state, sp=esc(speciesName(farm?.species));
  if(st==='nofarm')box.innerHTML=`<div class="my-state">양식장 정보가 없어요. <a href="app.html#register">양식장을 등록</a>하면 내 조건에 맞는 보험을 보여 드려요.</div>`;
  else if(st==='none')box.innerHTML=`<div class="my-state">${sp}에 맞는 보험 상품이 DB에서 확인되지 않았어요. 조건을 바꿔 보세요.</div>`;
  else if(st==='error'&&listSource!=='error')box.innerHTML=`<div class="my-state err">내 조건 상품을 불러오지 못했어요. 백엔드 서버가 켜져 있는지 확인해 주세요.<br><button class="retry" data-retry="my">다시 시도</button></div>`;
  else box.innerHTML='';
}

/* ===== 상품 목록 (위험별 보장 분류 포함) ===== */
let P=[], listSource='loading'; // loading | db | error
const detailCache={};           // product_id → DB 상세 | 'loading' | 'error'
function iconOf(x){ // 머리줄 아이콘만 상품명·품종으로 고른다 (내용 아님)
  const t=`${x.product_name||''} ${x.species||''}`;
  if(/시설물/.test(t))return '🏗️';
  if(/김|미역|다시마|톳|해조/.test(t))return '🌿';
  if(/굴|멍게|전복|홍합|가리비|미더덕|오만둥이/.test(t))return '🐚';
  if(/새우|우렁이/.test(t))return '🦐';
  return '🐟';
}
async function loadProducts(){
  listSource='loading';render();
  try{
    const list=await getJSON(`${API_BASE}/api/v1/insurance/overview`);
    P=list.map(x=>({
      id:x.product_id, name:x.product_name, species:x.species, version:x.document_version, ic:iconOf(x), mine:false,
      risks:RISK3.filter(r=>(x.risks?.[r]?.status||'none')!=='none'),
    }));
    listSource='db';
  }catch(e){P=[];listSource='error';}
  markMine();render();
}
function markMine(){P.forEach(p=>{p.mine=!!myIds?.includes(p.id);});}
async function openDbDetail(id){
  if(detailCache[id]&&detailCache[id]!=='error')return;
  detailCache[id]='loading';renderIns();
  try{detailCache[id]=await getJSON(`${API_BASE}/api/v1/insurance/products/${encodeURIComponent(id)}`);}
  catch(e){detailCache[id]='error';}
  if(openId===id)renderIns();
}

/* ===== 상세: DB 칸을 그대로 섹션으로 (제목만 화면이 붙임) ===== */
const has=v=>Array.isArray(v)?v.length>0:!!v;
const pre=v=>`<p class="pre">${esc(textOf(v))}</p>`;
const ul=items=>`<ul class="my-list">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
const covText=c=>[c.name,[c.contract_type,c.effect].filter(Boolean).join(' · ')].filter(Boolean).map((t,i)=>i?`(${t})`:t).join(' ');
const SECTIONS=[
  ['coverages','🛡️','보상하는 재해'],
  ['government_subsidy','🏛️','보험료 정부 지원'],
  ['eligibility','👤','가입 대상'],
  ['deductible','📌','자기부담금'],
  ['period','📅','판매 기간 · 보험기간'],
  ['premium_payment_method','💳','보험료 납입 방법'],
  ['exclusions','🚫','보상하지 않는 손해'],
  ['claim_rules','📝','보험금 청구 규칙'],
  ['withdrawal_cancellation','↩️','청약 철회 · 해지'],
  ['refund_terms','💵','환급'],
  ['contacts','☎️','문의처'],
  ['warnings','⚠️','확인할 사항'],
];
function hasSection(d,k){
  if(k==='period')return has(d.sale_period)||has(d.insurance_period);
  return has(d[k]);
}
function sectionHtml(d,k){
  if(k==='coverages'){
    // DB의 contract_type(주계약/특약) 값으로 묶어, 나온 순서대로 보여 준다
    const groups=new Map();
    d.coverages.forEach(c=>{const g=c.contract_type||'';if(!groups.has(g))groups.set(g,[]);groups.get(g).push(c);});
    return [...groups].map(([g,cs])=>(g?`<h4>${esc(g)}</h4>`:'')+ul(cs.map(c=>c.name+(c.effect?` (${c.effect})`:'')))).join('');
  }
  if(k==='period')return (has(d.sale_period)?'<h4>판매 기간</h4>'+pre(d.sale_period):'')+(has(d.insurance_period)?'<h4>보험기간</h4>'+pre(d.insurance_period):'');
  if(k==='exclusions')return ul(d.exclusions.map(x=>[x.summary,x.scope&&`(${x.scope})`].filter(Boolean).join(' ')));
  if(k==='claim_rules')return ul(d.claim_rules.map(x=>[x.rule_type&&`[${x.rule_type}]`,x.description].filter(Boolean).join(' ')));
  if(k==='warnings')return Array.isArray(d.warnings)?ul(d.warnings.map(textOf)):pre(d.warnings);
  return pre(d[k]);
}
// 펼친 상품: 선택한 위험(전체면 고수온)에 해당하는 DB 보장 항목 + 섹션 버튼
function riskLine(d){
  const r=cat==='all'?'hot':cat, c=C(r);
  const hits=(d.coverages||[]).filter(x=>RISK_RE[r].test(`${textOf(x.risk_types)} ${x.name||''} ${x.coverage_key||''}`));
  return hits.length?`<div class="hit">${c.ic} <span><b>${c.label} 관련 보장</b><br><small>${hits.map(x=>esc(covText(x))).join('<br>')}</small></span></div>`:'';
}
function detailButtons(d){
  return `<div class="sec-grid">${SECTIONS.filter(([k])=>hasSection(d,k)).map(([k,ic,t])=>
    `<button class="sec-btn" data-sec="${k}" data-pid="${d.product_id}" aria-haspopup="dialog"><span class="bi" aria-hidden="true">${ic}</span>${t}</button>`).join('')}</div>`;
}
let sheetReturn=null;
function openSheet(d,k){
  const [,ic,title]=SECTIONS.find(x=>x[0]===k);
  $('#sheetIc').textContent=ic;
  $('#sheetTitle').innerHTML=`${title}<small>${esc(d.product_name)}</small>`;
  $('#sheetBody').innerHTML=sectionHtml(d,k);
  $('#sheetBody').scrollTop=0;
  sheetReturn=document.activeElement;
  $('#sheetDim').hidden=false;$('#sheet').hidden=false;$('#sheetClose').focus();
}
function closeSheet(){
  if($('#sheet').hidden)return;
  $('#sheetDim').hidden=true;$('#sheet').hidden=true;sheetReturn?.focus();
}

/* ===== 지원제도: DB gov24 스키마 ===== */
let supSource='loading', SUPDB=[]; // loading | db | error
const SUP_RISK={hot:/고수온|수온|액화산소|산소|차광|재해|보험|피해/,cold:/저수온|한파|월동|재해|보험|피해/,redtide:/적조|황토|재해|보험|피해/};
async function loadSupport(){
  supSource='loading';if(tab==='sup')render();
  try{
    const q=farm?.region?`?region=${encodeURIComponent(farm.region)}`:'';
    const list=await getJSON(`${API_BASE}/api/v1/support/services${q}`);
    SUPDB=list.map(x=>{
      const text=`${x.name||''} ${x.content||''} ${x.target||''}`;
      return {...x,id:x.service_id,risks:RISK3.filter(r=>SUP_RISK[r].test(text))};
    });
    supSource='db';
  }catch(e){SUPDB=[];supSource='error';}
  if(tab==='sup')render();
}
function supDbBody(s){
  const p=v=>v?`<p class="pre">${esc(v)}</p>`:'';
  const ben=(ic,title,body)=>body?`<div class="ben"><span class="bi">${ic}</span><div style="flex:1"><h5>${title}</h5>${body}</div></div>`:'';
  const phone=String(s.phone||'').match(/\d{2,4}-\d{3,4}-\d{4}/);
  const url=/^https?:\/\//.test(s.detail_url||'')?s.detail_url:'';
  return `
    ${ben('🎁','지원 내용',p(s.content))}
    ${ben('👤','지원 대상',p(s.target))}
    ${ben('✅','선정 기준',p(s.criteria))}
    ${ben('🧭','신청 방법',p(s.how_to_apply))}
    ${ben('⏰','신청 기한',p(s.deadline))}
    ${ben('📍','접수 기관',p(s.reception))}
    ${ben('☎️','문의',p(s.phone))}
    ${url||phone?`<div class="acc-cta">${url?`<a class="p" href="${esc(url)}" target="_blank" rel="noopener">정부24에서 보기 ↗</a>`:''}${phone?`<a class="s" href="tel:${phone[0]}">전화 문의</a>`:''}</div>`:''}`;
}

/* ===== 그리기 ===== */
function renderCats(){
  $('#cats').innerHTML=CATS.map(c=>`<button class="cat ${c.id===cat?'on':''}" data-id="${c.id}" aria-pressed="${c.id===cat}"><span class="ic">${c.ic}</span><span>${c.label}</span></button>`).join('');
  $('#cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=b.dataset.id;renderCats();render();});
}
const errorBox=(msg,key)=>`<div class="my-state err">${msg}<br><button class="retry" data-retry="${key}">다시 시도</button></div>`;
function insBody(p){
  const d=detailCache[p.id];
  if(!d||d==='loading')return '<p class="empty">⏳ 상세 내용을 불러오는 중…</p>';
  if(d==='error')return errorBox('상세 내용을 불러오지 못했어요.','detail:'+p.id);
  return riskLine(d)+detailButtons(d);
}
function renderIns(){
  $('#exNote').textContent='※ DB(insurance 스키마)의 양식수산물재해보험 약관 자료를 그대로 보여 줍니다. 실제 보장 여부와 보험금은 약관과 상담으로 확인하세요.';
  $('#foot').innerHTML=listSource==='db'?`출처: DB insurance 스키마 (${P.length}개 상품)`:'';
  if(listSource==='error'){$('#cnt').innerHTML='내 조건에 맞는 보험';$('#list').innerHTML=errorBox('보험 상품을 불러오지 못했어요. 백엔드 서버가 켜져 있는지 확인해 주세요.','list');return;}
  if(listSource==='loading'||myResult?.state==='loading'){$('#cnt').innerHTML='내 조건에 맞는 보험';$('#list').innerHTML='<p class="empty">⏳ 보험 상품을 불러오는 중…</p>';return;}
  // 내 조건 상품만, 백엔드가 정한 순서대로
  const mine=P.filter(p=>p.mine).sort((a,b)=>myIds.indexOf(a.id)-myIds.indexOf(b.id));
  const arr=mine.filter(p=>cat==='all'||p.risks.includes(cat));
  if(!arr.some(p=>p.id===openId)) openId=-1;
  $('#cnt').innerHTML=cat==='all'?`내 조건에 맞는 보험 <em>${arr.length}</em>개`:`내 조건 · ${C(cat).label} 보장 <em>${arr.length}</em>개`;
  $('#list').innerHTML=arr.length?arr.map(p=>`
    <div class="acc mine ${p.id===openId?'open':''}" data-id="${p.id}">
      <button class="acc-h" aria-expanded="${p.id===openId}">
        <span class="acc-ic">${p.ic}</span>
        <span class="acc-t"><span class="badges"><span class="bd ok">DB 연결</span></span>
          <b>${esc(p.name)}</b><small>${esc(cut(p.species,40))}${p.version?' · '+esc(p.version):''}</small></span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="acc-b">${p.id===openId?insBody(p):''}</div>
    </div>`).join(''):(mine.length?`<p class="empty">내 조건 상품 ${mine.length}개 중 ${C(cat).label} 보장 상품은 없어요.<br>'전체'를 눌러 확인해 보세요.</p>`:'');
  $('#list').querySelectorAll('.acc-h').forEach(h=>h.onclick=()=>{
    const id=+h.parentElement.dataset.id; openId=(openId===id)?-1:id; renderIns();
    if(openId===id)openDbDetail(id);
  });
}
function renderSup(){
  if(supSource==='loading'){$('#cnt').innerHTML='지원제도';$('#list').innerHTML='<p class="empty">⏳ 지원제도를 불러오는 중…</p>';$('#exNote').textContent='';$('#foot').innerHTML='';return;}
  if(supSource==='error'){$('#cnt').innerHTML='지원제도';$('#list').innerHTML=errorBox('지원제도를 불러오지 못했어요. 백엔드 서버가 켜져 있는지 확인해 주세요.','sup');$('#exNote').textContent='';$('#foot').innerHTML='';return;}
  const arr=SUPDB.filter(s=>cat==='all'||s.risks.includes(cat));
  if(!arr.some(s=>s.id===openSup)) openSup='';
  $('#cnt').innerHTML=cat==='all'?`받을 수 있는 제도 <em>${arr.length}</em>개`:`${C(cat).label} 관련 제도 <em>${arr.length}</em>개`;
  $('#list').innerHTML=arr.length?arr.map(s=>`
    <div class="acc sup ${s.id===openSup?'open':''}" data-id="${esc(s.id)}">
      <button class="acc-h" aria-expanded="${s.id===openSup}">
        <span class="acc-ic">🏛️</span>
        <span class="acc-t"><span class="badges"><span class="bd ok">정부24</span>${s.support_type?`<span class="bd ex">${esc(s.support_type)}</span>`:''}</span>
          <b>${esc(s.name)}</b><small>${esc(s.agency)}</small></span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="acc-b">${s.id===openSup?supDbBody(s):''}</div>
    </div>`).join(''):'<p class="empty">조건에 맞는 지원제도가 없습니다. "전체"를 눌러 모든 제도를 확인해 보세요.</p>';
  $('#list').querySelectorAll('.acc-h').forEach(h=>h.onclick=()=>{
    const id=h.parentElement.dataset.id; openSup=(openSup===id)?'':id; renderSup();
  });
  const where=['해양수산부','경상남도',farm?.region&&`경상남도 ${String(farm.region).replace(/\(.*\)/,'')}`].filter(Boolean).join('·');
  $('#exNote').textContent=`※ 정부24 공공서비스 중 ${where} 소관의 양식·어업 관련 제도입니다. 지원 조건과 기한은 바뀔 수 있으니 신청 전 소관 기관에 확인하세요.`;
  $('#foot').innerHTML='출처: 정부24 공공서비스 목록 (DB gov24 스키마)';
}
function render(){
  renderMy();
  tab==='ins'?renderIns():renderSup();
}

/* ===== 이벤트 ===== */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  tab=t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>{x.classList.toggle('on',x===t);x.setAttribute('aria-selected',x===t)});
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
// 목록·안내는 다시 그려지므로 클릭은 위임으로 처리
document.addEventListener('click',e=>{
  const sec=e.target.closest('.sec-btn');
  if(sec){const d=detailCache[+sec.dataset.pid];if(d&&typeof d==='object')openSheet(d,sec.dataset.sec);return;}
  const retry=e.target.closest('[data-retry]')?.dataset.retry;
  if(!retry)return;
  if(retry==='my')loadMySummary();
  else if(retry==='list'){loadProducts();loadMySummary();}
  else if(retry==='sup')loadSupport();
  else if(retry.startsWith('detail:'))openDbDetail(+retry.slice(7));
});
$('#sheetClose').onclick=closeSheet;
$('#sheetDim').onclick=closeSheet;
$('#condText').innerHTML=farm
  ?`<b>${esc(farm.region)}</b> · <b>${esc(speciesName(farm.species))}</b> · ${esc(farm.method)} · ${esc(farm.insurance)}`
  :'양식장 정보 없음';
renderCats();render();loadMySummary();loadProducts();loadSupport();
</script>
</body>
</html>
