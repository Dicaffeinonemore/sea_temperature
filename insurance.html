<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보험 정보 비교</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1f5fd6; --blue-d:#174bb0; --blue-l:#eaf1ff; --blue-ll:#f5f8ff;
    --green:#16a34a; --green-d:#15803d; --green-l:#e9f8ef; --amber:#b45309; --amber-l:#fff4e0;
    --ink:#111827; --sub:#374151; --mute:#6b7280; --line:#e5e7eb; --bg:#eef2f8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0}
  .screen{background:#fff;max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
  /* 햄버거 메뉴 */
  .dim{position:absolute;inset:0;background:rgba(17,24,39,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
  .menu{position:absolute;top:0;right:0;bottom:0;width:78%;background:#fff;z-index:6;transform:translateX(100%);transition:transform .25s;
        display:flex;flex-direction:column;padding:56px 14px 20px;box-shadow:-8px 0 24px rgba(17,24,39,.15)}
  .screen.menu-open .dim{opacity:1;pointer-events:auto}
  .screen.menu-open .menu{transform:none}
  .menu-top{display:flex;justify-content:space-between;align-items:center;padding:0 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .menu-top b{font-size:20px;font-weight:800}
  .menu a{display:flex;align-items:center;gap:14px;padding:15px 12px;border-radius:14px;font-size:18px;font-weight:700;color:var(--ink);text-decoration:none}
  .menu a .mi{width:42px;height:42px;border-radius:12px;background:#f3f4f6;display:grid;place-items:center;font-size:21px}
  .menu a.on{background:var(--blue-ll);color:var(--blue)}
  .menu a.on .mi{background:var(--blue-l)}
  .menu a.on::after{content:"현재";margin-left:auto;font-size:13px;font-weight:700;background:var(--blue);color:#fff;border-radius:99px;padding:3px 9px}
  .menu a:focus-visible,.icon-btn:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}
  .menu a small{display:block;font-size:13.5px;font-weight:500;color:var(--mute);margin-top:2px}
  .menu-foot{margin-top:auto;display:flex;justify-content:flex-end;padding-top:14px;border-top:1px solid var(--line)}
  .logout{font:inherit;font-size:15px;font-weight:700;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer}
  .logout:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 18px 6px}
  .top h2{font-size:22px;font-weight:800}
  .icon-btn{background:none;border:0;font-size:24px;color:var(--ink);cursor:pointer;width:40px;height:40px}
  .scroll{flex:1;overflow-y:auto;padding:4px 16px 20px}
  .scroll::-webkit-scrollbar{width:0}


  .tabs{display:flex;gap:8px;margin:0 0 14px}
  .tab{flex:1;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16.5px;color:var(--mute);font-weight:600;cursor:pointer}
  .tab.on{border-color:var(--blue);color:var(--blue);background:var(--blue-ll);font-weight:800}

  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .cat{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 2px 10px;cursor:pointer;font:inherit;
       display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--sub);transition:.15s}
  .cat .ic{font-size:26px;line-height:1}
  .cat span{font-size:16px;font-weight:700;white-space:nowrap}
  .cat.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(31,95,214,.28)}
  .cat:focus-visible,.tab:focus-visible,.acc-h:focus-visible,.btn:focus-visible,.toggle:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}

  .cond{background:var(--blue-ll);border:1px solid #d7e3fb;border-radius:12px;padding:12px;font-size:15px;color:var(--sub);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cond b{color:var(--ink)}
  .cond a{color:var(--blue);font-weight:700;text-decoration:none;font-size:15px;white-space:nowrap}

  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .bar b{font-size:17.5px} .bar b em{font-style:normal;color:var(--blue)}
  .toggle{font:inherit;font-size:14.5px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;color:var(--sub);cursor:pointer;font-weight:600}
  .toggle.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* 드롭다운 블록 (보험·지원제도 공통) */
  .acc{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff;overflow:hidden;transition:border-color .15s}
  .acc.mine{border-color:#b9cdf5}
  .acc.open{border:2px solid var(--blue);box-shadow:0 6px 18px rgba(31,95,214,.12)}
  .acc.sup.open{border-color:var(--green);box-shadow:0 6px 18px rgba(22,163,74,.12)}
  .acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px 12px;background:none;border:0;font:inherit;text-align:left;cursor:pointer;color:inherit}
  .acc-ic{width:46px;height:46px;border-radius:13px;background:var(--blue-l);display:grid;place-items:center;font-size:24px;flex:none}
  .sup .acc-ic{background:var(--green-l)}
  .acc-t{flex:1;min-width:0}
  .acc-t b{display:block;font-size:17px;line-height:1.4}
  .acc-t small{font-size:14px;color:var(--mute)}
  .badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
  .bd{display:inline-block;font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 7px}
  .bd.mine{background:var(--blue);color:#fff}
  .bd.ok{background:var(--green-l);color:var(--green-d)}
  .bd.ex{background:#f3f4f6;color:var(--mute)}
  .bd.tbd{background:var(--amber-l);color:var(--amber)}
  .chev{width:30px;height:30px;border-radius:50%;background:#f3f4f6;display:grid;place-items:center;flex:none;transition:transform .2s}
  .chev::before{content:"";width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:translateY(-2px) rotate(45deg)}
  .acc.open .chev{transform:rotate(180deg);background:var(--blue-l)}
  .acc-b{display:none;padding:0 14px 14px}
  .acc.open .acc-b{display:block}

  .hit{display:flex;gap:8px;align-items:flex-start;background:#fff7d6;border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.5;margin-bottom:10px;color:#713f12}
  .hit b{color:#713f12}
  .hit.no{background:#f3f4f6;color:var(--sub)} .hit.no b{color:var(--ink)}
  .ben{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .ben:first-of-type{border-top:0}
  .ben .bi{width:34px;height:34px;border-radius:9px;background:var(--green-l);display:grid;place-items:center;font-size:17px;flex:none}
  .ben h5{font-size:16px;font-weight:800;margin-bottom:4px}
  .ben p{font-size:15px;color:var(--sub);line-height:1.6}
  .ben p+p{margin-top:4px}
  .ben .sm{font-size:14px;color:var(--mute)}
  .tbd{display:inline-block;font-size:12.5px;font-weight:700;background:var(--amber-l);color:var(--amber);border-radius:5px;padding:1px 6px;vertical-align:1px}
  .chips{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .chip{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:7px 10px;border-radius:10px;background:#f6f7f9;color:var(--sub)}
  .chip i{font-style:normal;font-size:13.5px;font-weight:700;padding:2px 8px;border-radius:99px}
  .chip i.base{background:var(--green-l);color:var(--green-d)}
  .chip i.opt{background:var(--blue-l);color:var(--blue)}
  .chip i.excl{background:var(--amber-l);color:var(--amber)}
  .chip i.none{background:#eceef1;color:var(--mute)}
  .chip.on{background:#fde68a;color:#713f12;font-weight:700}
  .docs{display:flex;gap:6px;margin-top:6px}
  .doc{flex:1;font-size:14px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:8px 2px;color:var(--sub)}
  .doc::before{content:"PDF ";color:#dc2626;font-weight:800;font-size:12px}
  .acc-cta{display:flex;gap:6px;margin-top:12px}
  .acc-cta a{flex:1;text-align:center;font-size:15.5px;font-weight:700;border-radius:12px;padding:13px 4px;text-decoration:none}
  .acc-cta .p{background:var(--blue);color:#fff}
  .acc-cta .s{background:#fff;color:var(--blue);border:1px solid #c9d8f7}
  .sup .acc-cta .p{background:var(--green)}
  .sup .acc-cta .s{color:var(--green-d);border-color:#bfe5cc}
  .steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .steps li{counter-increment:s;font-size:15px;color:var(--sub);line-height:1.5;display:flex;gap:8px}
  .steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:1px}

  .ex{font-size:13.5px;color:var(--mute);margin-top:8px;line-height:1.6}
  .btn{display:flex;width:100%;justify-content:center;align-items:center;gap:6px;border-radius:14px;padding:15px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;text-decoration:none;border:0}
  .btn.pri{background:var(--ink);color:#fff;margin-top:10px}
  .foot{font-size:13px;color:var(--mute);margin-top:12px;line-height:1.6}
  .empty{font-size:15px;color:var(--mute);padding:24px 0;text-align:center}

  /* 하단 탭바 */
  .tabbar{display:flex;gap:4px;border-top:1px solid var(--line);background:#fff;padding:6px 10px calc(10px + env(safe-area-inset-bottom));flex:none}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:14px;
            font-size:14.5px;font-weight:700;color:var(--mute);text-decoration:none}
  .tabbar a .ti{font-size:25px;line-height:1;filter:grayscale(1);opacity:.55}
  .tabbar a.on{color:var(--blue);background:var(--blue-ll)}
  .tabbar a.on .ti{filter:none;opacity:1}
  .tabbar a:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}
</style>
</head>

    <div class="acc ${p.mine?'mine':''} ${p.id===openId?'open':''}" data-id="${p.id}">
      <button class="acc-h" aria-expanded="${p.id===openId}">
        <span class="acc-ic">${p.g.ic}</span>
        <span class="acc-t"><span class="badges">${p.mine?'<span class="bd mine">내 품종 대상</span>':''}${p.verified?'<span class="bd ok">약관 확인</span>':'<span class="bd ex">예시</span>'}</span>
          <b>${p.name}</b><small>${p.g.label} · 판매개시 ${p.start}</small></span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="acc-b">${p.id===openId?insBody(p):''}</div>
    </div>`).join(''):'<p class="empty">조건에 맞는 상품이 없습니다.</p>';
  $('#list').querySelectorAll('.acc-h').forEach(h=>h.onclick=()=>{
    const id=+h.parentElement.dataset.id; openId=(openId===id)?-1:id; renderIns();
  });
  $('#exNote').textContent='※ "약관 확인" 상품 5개는 2026-05-13 판매개시 약관·사업방법서·상품요약서 기준으로 요약했고, 나머지 상품은 화면 구성용 예시입니다. 실제 조건은 약관과 상담으로 확인하세요.';
  $('#foot').innerHTML='출처: 수협은행 보험 &gt; 공시실 &gt; 양식수산물재해보험공시 &gt; 판매중인상품 (2026-10-15 기준 33개 상품)';
}
function renderSup(){
  const arr=SUP.filter(s=>cat==='all'||s.risks.includes(cat));
  if(!arr.some(s=>s.id===openSup)) openSup='';
  $('#cnt').innerHTML=cat==='all'?`받을 수 있는 제도 <em>${arr.length}</em>개`:`${C(cat).label} 관련 제도 <em>${arr.length}</em>개`;
  $('#list').innerHTML=arr.map(s=>{const st=SUP_STATE[s.state];return `
    <div class="acc sup ${s.id===openSup?'open':''}" data-id="${s.id}">
      <button class="acc-h" aria-expanded="${s.id===openSup}">
        <span class="acc-ic">${s.ic}</span>
        <span class="acc-t"><span class="badges"><span class="bd ${st.c}">${st.t}</span></span>
          <b>${s.name}</b><small>${s.org}</small></span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="acc-b">${s.id===openSup?supBody(s):''}</div>
    </div>`}).join('');
  $('#list').querySelectorAll('.acc-h').forEach(h=>h.onclick=()=>{
    const id=h.parentElement.dataset.id; openSup=(openSup===id)?'':id; renderSup();
  });
  $('#exNote').textContent='※ 지원제도는 확정 전 시안입니다. "미확정" 표시는 근거 자료를 아직 확인하지 못한 값이니, 신청 전 시·군청과 수협에 꼭 확인하세요.';
  $('#foot').innerHTML='근거: 양식수산물재해보험 약관·상품요약서(굴·멍게·오만둥이·육상수조식전복·해상가두리어류, 2026-05-13)';
}
function render(){
  $('#mineOnly').style.display=tab==='ins'?'':'none';
  tab==='ins'?renderIns():renderSup();
}
$('#mineOnly').onclick=e=>{mineOnly=!mineOnly;e.currentTarget.classList.toggle('on',mineOnly);e.currentTarget.setAttribute('aria-pressed',mineOnly);render();};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  tab=t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>{x.classList.toggle('on',x===t);x.setAttribute('aria-selected',x===t)});
  render();
});
function setMenu(open){
  $('.screen').classList.toggle('menu-open',open);
  $('#menuBtn').setAttribute('aria-expanded',open);
  $('#menu').setAttribute('aria-hidden',!open);
}
$('#menuBtn').onclick=()=>setMenu(true);
$('#menuClose').onclick=()=>setMenu(false);
$('#logoutBtn').onclick=()=>{try{sessionStorage.removeItem('farm');}catch{}location.href='app.html';}; // 인증 연결 전까지는 양식장 정보만 지웁니다.
$('#dim').onclick=()=>setMenu(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
renderCats();render();
</script>
</body>
</html>
