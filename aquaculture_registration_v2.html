<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 양식장 등록</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    background: #F4F6F8;
    color: #14202B;
    padding: 12px;
  }
  .container {
    max-width: 420px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  }
  .header {
    padding: 16px 20px 8px;
    font-size: 15px;
    color: #5A6A7A;
    border-bottom: 1px solid #EEF1F4;
  }
  .title {
    font-size: 24px;
    font-weight: 800;
    padding: 18px 20px 6px;
  }
  .form {
    padding: 8px 16px 24px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }
  label, .field-title {
    font-size: 19px;
    font-weight: 700;
  }
  .select-box, .month-box {
    height: 58px;
    border-radius: 14px;
    border: 2px solid #B8C4D0;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
  }
  .method-note {
    font-size: 16px;
    color: #3A4A5A;
  }
  .btn-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  .btn-grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .option-btn {
    height: 58px;
    border-radius: 14px;
    border: 2px solid #B8C4D0;
    background: #FFFFFF;
    font-family: inherit;
    font-size: 19px;
    font-weight: 700;
    color: #14202B;
    cursor: pointer;
  }
  .option-btn.selected {
    border: 2px solid #0B5CAD;
    background: #0B5CAD;
    color: #FFFFFF;
    font-weight: 800;
  }
  .option-btn.small {
    height: 56px;
    font-size: 18px;
  }
  #additional {
    display: flex;
    background: #FFFFFF;
    border: 2px solid #D5DEE8;
    border-radius: 18px;
    padding: 16px;
    margin-top: 6px;
    flex-direction: column;
    gap: 16px;
  }
  .note {
    font-size: 17px;
    color: #0B4A8A;
    font-weight: 700;
  }
  .premium-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .premium-row input {
    flex: 1;
    min-width: 0;
    height: 56px;
    border-radius: 14px;
    border: 2px solid #B8C4D0;
    padding: 0 16px;
    font-family: inherit;
    font-size: 20px;
    font-weight: 600;
  }
  .unit {
    font-size: 20px;
    font-weight: 700;
  }
  .submit-btn {
    width: 100%;
    height: 58px;
    margin-top: 20px;
    background: #0B5CAD;
    color: #FFFFFF;
    border: none;
    border-radius: 14px;
    font-size: 19px;
    font-weight: 800;
    cursor: pointer;
  }
  .submit-btn:active {
    background: #094A8A;
  }

  fieldset { border: 0; min-width: 0; }
  select, input { font-family: inherit; width: 100%; }
  select.select-box { appearance: auto; font-size: 18px; }
  input[type="month"] { width: 100%; }
  .option-btn { height: auto; min-height: 58px; padding: 10px 4px; }
  .option-btn:disabled, .submit-btn:disabled { opacity: .55; cursor: not-allowed; }
  :focus-visible { outline: 3px solid #0B5CAD; outline-offset: 3px; }
  [hidden] { display: none !important; }
  #status { padding: 12px 16px; line-height: 1.6; overflow-wrap: anywhere; }
  #status[data-error="true"] { color: #14202B; font-weight: 700; }
  .reload-btn { margin-bottom: 16px; font: inherit; padding: 10px 16px; cursor: pointer; }
  .method-note { line-height: 1.5; }
</style>
</head>
<body>
<main class="container">
  <div class="header">우리 바다 안심도우미</div>
  <h1 class="title">내 양식장 등록</h1>
  <p id="status" role="status" aria-live="polite">지역·어종 목록을 불러오는 중입니다.</p>
  <form id="registration-form" class="form">
    <button type="button" id="reload" class="reload-btn">목록 새로고침</button>
    <fieldset id="form-fields" disabled>
      <div class="field">
        <label for="reg-region">양식장 지역 · 시군구</label>
        <select class="select-box" id="reg-region" required></select>
      </div>
      <div class="field">
        <label for="reg-area">읍·면·동</label>
        <select class="select-box" id="reg-area" required disabled></select>
        <p class="method-note">등록된 읍·면·동·리 명칭을 표시합니다.</p>
      </div>
      <div class="field">
        <label for="reg-fish">기르는 어종</label>
        <select class="select-box" id="reg-fish" required></select>
      </div>
      <div class="field" id="abalone-field" hidden>
        <label for="reg-abalone">전복 구분</label>
        <select class="select-box" id="reg-abalone">
          <option value="">육상·해상을 선택하세요</option>
          <option value="전복(육상)">육상</option>
          <option value="전복(해상)">해상</option>
        </select>
      </div>
      <div class="field">
        <label for="reg-method">양식 방식</label>
        <select class="select-box" id="reg-method" required>
          <option value="">양식 방식을 선택하세요</option>
          <option value="cage">해상 가두리</option>
          <option value="land_based">육상</option>
        </select>
        <p class="method-note" id="method-note" hidden>전복 구분에 따라 양식 방식이 정해집니다.</p>
      </div>
      <div class="field">
        <div class="field-title" id="insurance-label">재해보험에 가입하셨어요?</div>
        <div class="btn-grid-2" id="insuranceGroup" role="group" aria-labelledby="insurance-label">
          <button type="button" class="option-btn" data-value="uninsured" aria-pressed="false">안 했어요</button>
          <button type="button" class="option-btn" data-value="insured" aria-pressed="false">했어요</button>
        </div>
      </div>
      <div id="additional" hidden>
        <p class="note">가입하신 분만 · 보험증권을 보고 적어 주세요</p>
        <div class="field">
          <div class="field-title" id="high-temp-label">고수온도 넣으셨어요?</div>
          <div class="btn-grid-3" id="highTempGroup" role="group" aria-labelledby="high-temp-label">
            <button type="button" class="option-btn small" data-value="yes" aria-pressed="false">넣었어요</button>
            <button type="button" class="option-btn small" data-value="no" aria-pressed="false">안 넣었어요</button>
            <button type="button" class="option-btn small selected" data-value="unknown" aria-pressed="true">모르겠어요</button>
          </div>
        </div>
        <div class="field">
          <label for="reg-premium">총 보험료</label>
          <div class="premium-row">
            <input type="number" id="reg-premium" placeholder="예: 1000" min="0" max="100000000" step="0.0001" aria-describedby="premium-help">
            <span class="unit">만 원</span>
          </div>
          <p class="method-note" id="premium-help">나라·도 지원 전 금액이에요. 모르면 비워 두세요.</p>
        </div>
        <div class="field">
          <div class="field-title" id="payment-label">어떻게 내세요?</div>
          <div class="btn-grid-3" id="paymentGroup" role="group" aria-labelledby="payment-label">
            <button type="button" class="option-btn small" data-value="once" aria-pressed="false">한 번에</button>
            <button type="button" class="option-btn small" data-value="twice" aria-pressed="false">두 번 나눠서</button>
            <button type="button" class="option-btn small selected" data-value="unknown" aria-pressed="true">모르겠어요</button>
          </div>
        </div>
        <div class="field">
          <label for="reg-month">가입한 달</label>
          <input type="month" class="month-box" id="reg-month" min="1900-01" max="9999-12">
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submit">등록하기</button>
    </fieldset>
  </form>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
let catalog = {regions: [], species: []};
let farmId = null;
let busy = false;

function status(message, error = false) {
  byId('status').textContent = message;
  byId('status').dataset.error = String(error);
  byId('status').setAttribute('role', error ? 'alert' : 'status');
}

async function api(path, options = {}) {
  let response;
  try {
    response = await fetch(path, {credentials: 'same-origin', ...options,
      headers: {'Content-Type': 'application/json', 'X-CSRF-Protection': '1'}});
  } catch (error) {
    if (!(error instanceof TypeError)) throw error;
    throw new Error('서버에 연결할 수 없습니다. 연결 상태를 확인하고 다시 시도해 주세요.');
  }
  const data = await response.json();
  if (!response.ok) {
    const error = new Error(response.status === 503
      ? '저장소를 사용할 수 없습니다. 관리자에게 등록 테이블과 연결 상태 확인을 요청해 주세요.'
      : (typeof data.detail === 'string' ? data.detail : '입력값을 확인하고 다시 시도해 주세요.'));
    error.status = response.status;
    throw error;
  }
  return data;
}

function options(id, rows, placeholder) {
  const select = byId(id);
  select.replaceChildren(new Option(placeholder, ''), ...rows.map(([value, label]) => new Option(label, value)));
}

function selectGroup(id, value) {
  byId(id).querySelectorAll('button').forEach(button => {
    const selected = button.dataset.value === value;
    button.classList.toggle('selected', selected);
    button.setAttribute('aria-pressed', String(selected));
  });
}

function groupValue(id) {
  return byId(id).querySelector('[aria-pressed="true"]')?.dataset.value ?? null;
}

function insuranceChanged() {
  const insured = groupValue('insuranceGroup') === 'insured';
  byId('additional').hidden = !insured;
  byId('additional').querySelectorAll('input, button').forEach(input => { input.disabled = !insured; });
}

function regionChanged() {
  const rows = catalog.regions.filter(row => row.sigungu_name === byId('reg-region').value);
  options('reg-area', rows.map(row => [row.region_id, row.area_name]), '읍·면·동을 선택하세요');
  byId('reg-area').disabled = rows.length === 0;
}

function speciesChanged() {
  const name = catalog.species.find(row => String(row.species_id) === byId('reg-fish').value)?.species_name;
  byId('abalone-field').hidden = name !== '전복';
  byId('reg-abalone').required = name === '전복';
  if (name !== '전복') byId('reg-abalone').value = '';
  const resolvedName = name === '전복' ? byId('reg-abalone').value : name;
  const method = {'전복(육상)': 'land_based', '전복(해상)': 'cage'}[resolvedName];
  byId('reg-method').disabled = Boolean(method);
  byId('method-note').hidden = !method;
  if (method) byId('reg-method').value = method;
}

function restoreFarm(farm) {
  if (farm.species_ids.length !== 1) throw new Error('여러 어종이 등록된 양식장입니다. 이 화면에서는 변경할 수 없습니다.');
  const region = catalog.regions.find(row => row.region_id === farm.region_id);
  const species = catalog.species.find(row => row.species_id === farm.species_ids[0]);
  if (!region || !species) throw new Error('기존 등록 정보가 현재 목록에 없습니다. 관리자에게 확인해 주세요.');
  farmId = farm.farm_id;
  byId('reg-region').value = region.sigungu_name;
  regionChanged();
  byId('reg-area').value = String(region.region_id);
  byId('reg-fish').value = String(species.species_id);
  speciesChanged();
  byId('reg-method').value = farm.farming_method;
  selectGroup('insuranceGroup', farm.insurance_status);
  selectGroup('highTempGroup', farm.high_temperature_coverage ?? 'unknown');
  selectGroup('paymentGroup', farm.premium_payment_method ?? 'unknown');
  byId('reg-premium').value = farm.total_premium_won === null ? '' : String(farm.total_premium_won / 10000);
  byId('reg-month').value = farm.insurance_start_month?.slice(0, 7) ?? '';
  byId('submit').textContent = '저장하기';
  insuranceChanged();
}

async function load() {
  if (busy) return;
  busy = true;
  const previousRegion = byId('reg-region').value;
  const previousArea = byId('reg-area').value;
  const previousSpecies = byId('reg-fish').value;
  byId('form-fields').disabled = true;
  byId('reload').disabled = true;
  status('지역·어종 목록을 불러오는 중입니다.');
  try {
    const [regions, species] = await Promise.all([api('/api/regions'), api('/api/species')]);
    catalog = {regions, species};
    if (!regions.length || !species.length) throw new Error('등록 가능한 지역 또는 어종이 없습니다. 관리자에게 목록 확인을 요청해 주세요.');
    options('reg-region', [...new Set(regions.map(row => row.sigungu_name))].map(name => [name, name]), '시군구를 선택하세요');
    options('reg-fish', species.map(row => [row.species_id, row.species_name]), '어종을 선택하세요');
    byId('reg-region').value = previousRegion;
    regionChanged();
    byId('reg-area').value = previousArea;
    byId('reg-fish').value = previousSpecies;
    speciesChanged();
    if (!farmId) {
      let farms;
      try {
        farms = await api('/api/me/farms');
      } catch (error) {
        if (error.status !== 401) throw error;
        farms = [];
      }
      if (farms.length > 1) throw new Error('등록된 양식장이 여러 개입니다. 이 화면에서는 변경할 수 없습니다.');
      if (farms.length === 1) restoreFarm(farms[0]);
    }
    byId('form-fields').disabled = false;
    insuranceChanged();
    status(farmId ? '등록된 정보를 불러왔습니다. 내용을 수정하고 저장해 주세요.' : '지역·어종과 보험 가입 여부를 선택해 주세요.');
  } catch (error) {
    status(error.message, true);
  } finally {
    byId('reload').disabled = false;
    busy = false;
  }
}

byId('reg-region').addEventListener('change', regionChanged);
byId('reg-fish').addEventListener('change', () => {
  byId('reg-method').value = '';
  speciesChanged();
});
byId('reg-abalone').addEventListener('change', () => {
  byId('reg-method').value = '';
  speciesChanged();
});
['insuranceGroup', 'highTempGroup', 'paymentGroup'].forEach(id => {
  byId(id).querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
    selectGroup(id, button.dataset.value);
    if (id === 'insuranceGroup') insuranceChanged();
  }));
});
byId('reload').addEventListener('click', load);
byId('registration-form').addEventListener('submit', async event => {
  event.preventDefault();
  if (busy) return;
  const insurance = groupValue('insuranceGroup');
  if (!insurance) {
    status('재해보험 가입 여부를 선택해 주세요.', true);
    byId('insuranceGroup').querySelector('button').focus();
    return;
  }
  let species = catalog.species.find(row => String(row.species_id) === byId('reg-fish').value);
  if (species?.species_name === '전복') species = catalog.species.find(row => row.species_name === byId('reg-abalone').value);
  if (!species) { status('등록 가능한 어종을 선택해 주세요.', true); return; }
  const body = {region_id: Number(byId('reg-area').value), species_ids: [species.species_id],
    farming_method: byId('reg-method').value, insurance_status: insurance};
  if (insurance === 'insured') {
    const premium = byId('reg-premium').value;
    if (premium && !/^\d+(\.\d{1,4})?$/.test(premium)) {
      status('보험료는 원 단위까지 입력해 주세요. 1원은 0.0001만 원입니다.', true);
      byId('reg-premium').focus();
      return;
    }
    const [whole, fraction = ''] = premium.split('.');
    body.total_premium_won = premium ? Number(whole) * 10000 + Number(fraction.padEnd(4, '0')) : null;
    body.high_temperature_coverage = groupValue('highTempGroup');
    body.premium_payment_method = groupValue('paymentGroup');
    body.insurance_start_month = byId('reg-month').value ? byId('reg-month').value + '-01' : null;
  }
  busy = true;
  byId('form-fields').disabled = true;
  byId('reload').disabled = true;
  status('저장 중입니다.');
  try {
    const result = await api(farmId ? '/api/me/farms/' + farmId : '/api/guest-registrations',
      {method: farmId ? 'PATCH' : 'POST', body: JSON.stringify(body)});
    farmId = farmId ?? result.farm.farm_id;
    byId('submit').textContent = '저장하기';
    status('양식장 정보가 저장되었습니다. 내용을 바꾸고 다시 저장할 수 있습니다.');
  } catch (error) {
    status(error.message, true);
  } finally {
    byId('form-fields').disabled = false;
    byId('reload').disabled = false;
    busy = false;
    insuranceChanged();
  }
});
insuranceChanged();
if (location.protocol === 'file:') {
  status('백엔드를 실행한 뒤 http://127.0.0.1:8000/api/registration 주소로 열어 주세요.', true);
} else {
  load();
}
</script>
</body>
</html>
